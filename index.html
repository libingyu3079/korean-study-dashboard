<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Joy Log</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="locked">
    <section id="authScreen" class="auth-screen">
      <form id="loginForm" class="auth-card">
        <div class="auth-logo">+1</div>
        <h1>Daily Joy Log</h1>
        <p>输入你的专属访问码，进入自己的打卡空间。</p>
        <label for="accessCode">访问码</label>
        <input id="accessCode" type="password" autocomplete="current-password" placeholder="请输入访问码" />
        <button class="primary-btn" type="submit">进入</button>
        <small id="loginMessage">每个人的进度会分开保存在当前设备。</small>
      </form>
    </section>

    <main class="phone-shell" aria-label="手机打卡应用">
      <header class="app-header">
        <div>
          <p id="todayLabel">Today</p>
          <h1>FastLog</h1>
        </div>
        <div class="header-actions">
          <button id="openStats" class="ghost-icon" type="button" aria-label="查看统计">▦</button>
          <button id="logoutButton" class="ghost-icon" type="button" aria-label="退出登录">↗</button>
        </div>
      </header>

      <section class="hero-card">
        <div>
          <span>今日完成</span>
          <strong id="todayDoneCount">0</strong>
        </div>
        <div>
          <span>总打卡</span>
          <strong id="totalCheckins">0</strong>
        </div>
        <div>
          <span>连续天数</span>
          <strong id="streakCount">0</strong>
        </div>
      </section>

      <nav class="segment-tabs" aria-label="打卡分类">
        <button class="segment active" data-filter="all" type="button">所有</button>
        <button class="segment" data-filter="joy" type="button">快乐+1</button>
        <button class="segment" data-filter="must" type="button">每日必做</button>
      </nav>

      <button id="openAddHabit" class="add-habit-btn" type="button">＋ 添加事项</button>

      <section class="section-block" data-section="joy">
        <div class="section-title">
          <h2>快乐+1</h2>
          <span>给生活多加一分</span>
        </div>
        <div id="joyList" class="habit-list"></div>
      </section>

      <section class="section-block" data-section="must">
        <div class="section-title">
          <h2>每日必做</h2>
          <span>把重要的小事做完</span>
        </div>
        <div id="mustList" class="habit-list"></div>
      </section>

      <input id="photoInput" class="photo-input" type="file" accept="image/*" capture="environment" />

      <section id="addHabitSheet" class="sheet" hidden>
        <div class="sheet-backdrop" data-close-sheet="add"></div>
        <form id="addHabitForm" class="sheet-panel">
          <h2>添加事项</h2>
          <label for="habitTitle">名称</label>
          <input id="habitTitle" type="text" maxlength="16" placeholder="例如：运动、早睡、画画" required />

          <label for="habitGroup">模块</label>
          <select id="habitGroup">
            <option value="joy">快乐+1</option>
            <option value="must">每日必做</option>
          </select>

          <label for="habitIcon">图标</label>
          <input id="habitIcon" type="text" maxlength="4" placeholder="例如：🌙" />
          <div id="iconChoices" class="icon-choices" aria-label="备选图标"></div>

          <label for="habitColor">颜色</label>
          <input id="habitColor" type="color" value="#20bfa0" />

          <div class="sheet-actions">
            <button id="cancelAddHabit" class="secondary-btn" type="button">取消</button>
            <button class="primary-btn" type="submit">保存</button>
          </div>
        </form>
      </section>

      <section id="unlockSheet" class="unlock-sheet" hidden>
        <div class="unlock-backdrop"></div>
        <article class="unlock-panel">
          <div id="unlockPhoto" class="unlock-photo"></div>
          <small id="unlockSource">今日解锁</small>
          <h2 id="unlockTitle">打卡成功</h2>
          <p id="unlockText"></p>
          <div class="unlock-actions">
            <button id="attachPhoto" class="secondary-btn" type="button">补一张照片</button>
            <button id="closeUnlock" class="primary-btn" type="button">收下这句话</button>
          </div>
        </article>
      </section>

      <section id="statsScreen" class="stats-screen" hidden>
        <header class="stats-header">
          <button id="closeStats" class="plain-icon" type="button" aria-label="关闭统计">×</button>
          <h1>统计</h1>
          <span></span>
        </header>

        <section class="stats-summary">
          <div>
            <strong id="statsTotalCount">0</strong>
            <span>总次数</span>
          </div>
          <div>
            <strong id="statsTotalDays">0</strong>
            <span>总天数</span>
          </div>
        </section>

        <section class="month-picker">
          <button id="prevMonth" class="plain-icon" type="button" aria-label="上个月">‹</button>
          <strong id="currentMonthLabel">2026-06</strong>
          <button id="nextMonth" class="plain-icon" type="button" aria-label="下个月">›</button>
        </section>

        <div id="statsList" class="stats-list"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
